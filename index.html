<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Spool Finder</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Climate+Crisis&family=Open+Sans:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<nav class="main-nav">
    <div class="nav-inner">
      <span class="nav-logo logo-reset">SPOOL FINDER</span>
    </div>
  </nav>
  
<div class="page"> 
  <header>
    <h1 class="logo-reset">SPOOL<br>FINDER</h1>
    <p class="hero-subtitle">THE perfect substitute.</p>
  </header>

  <!-- 🔥 Sticky Block -->
  <div class="sticky-bar">
    <p class="section-label">Select your spool:</p>

    <div class="filters">
      <div class="filter-wrap">
        <select id="brandFilter"></select>
        <button class="clear-btn" data-target="brandFilter">✕</button>
      </div>

      <div class="filter-wrap">
        <select id="typeFilter"></select>
        <button class="clear-btn" data-target="typeFilter">✕</button>
      </div>

      <div class="filter-wrap">
        <select id="colorFilter"></select>
        <button class="clear-btn" data-target="colorFilter">✕</button>
      </div>
    </div>
  </div>

  <div id="results"></div>

  <div class="stats-divider"></div>

<div class="stats-section">
  <div class="stats-card">
    <div class="stats-number" id="stats-brands">0</div>
    <div class="stats-label">Brands</div>
  </div>

  <div class="stats-card">
    <div class="stats-number" id="stats-types">0</div>
    <div class="stats-label">Unique Types</div>
  </div>

  <div class="stats-card">
    <div class="stats-number" id="stats-records">0</div>
    <div class="stats-label">Spools</div>
  </div>
</div>
  
</div>

<script src="script.js"></script>
</body>
</html>
